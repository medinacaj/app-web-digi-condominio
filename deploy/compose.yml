services:
  app:
    stop_grace_period: 30s
    build:
      context: ..
    restart: unless-stopped
    environment:
      DIGI_PUBLIC_ORIGIN: https://${DIGI_DOMAIN:?Set DIGI_DOMAIN}
      DIGI_TRUST_PROXY: "1"
      DIGI_MAIL_API_KEY: ${DIGI_MAIL_API_KEY:?Set mail credential securely}
      DIGI_MAIL_FROM: ${DIGI_MAIL_FROM:?Set verified sender}
      DIGI_ADMIN_EMAIL: ${DIGI_ADMIN_EMAIL:-}
      DIGI_ADMIN_PASSWORD: ${DIGI_ADMIN_PASSWORD:-}
      DIGI_COMMUNITY_NAME: ${DIGI_COMMUNITY_NAME:-}
      DIGI_ACCOUNT_NAME: ${DIGI_ACCOUNT_NAME:-}
      DIGI_ACCOUNT_KIND: ${DIGI_ACCOUNT_KIND:-independent}
    volumes:
      - digi_data:/data
    networks:
      - backend
    # No published HTTP port: only the TLS reverse proxy reaches the backend.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DIGI_DOMAIN: ${DIGI_DOMAIN:?Set DIGI_DOMAIN}
      DIGI_TLS_EMAIL: ${DIGI_TLS_EMAIL:?Set certificate contact}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
volumes:
  digi_data:
  caddy_data:
  caddy_config:
networks:
  backend:
