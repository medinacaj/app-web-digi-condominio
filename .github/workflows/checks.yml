name: Comprobaciones Digi-Condominio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y pruebas
        run: npm run check

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Usar Chrome preinstalado y Playwright (sin descargar navegador)
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Comprobar app web contra backend HTTP real
        env:
          DIGI_E2E_MODE: direct
          DIGI_E2E_SCREENSHOT_DIR: artifacts
        run: |
          python tests/browser-e2e.py
          python tests/local-launcher-browser.py
          python tests/accounts-browser.py
          python tests/online-browser.py
      - name: Guardar vistas del directorio con datos sintéticos
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: digicondominio-directorio-recordatorios-preview
          path: |
            artifacts/digi-directorio-*.png
            artifacts/digi-recordatorios-*.png
          retention-days: 7
          if-no-files-found: error

  windows-local:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar aplicación e iniciador Windows real
        run: npm run check

  container-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Construir contenedor de piloto
        run: docker build -t digi-condominio:pilot-test .
      - name: Verificar TLS y persistencia con datos sintéticos
        run: python3 scripts/testing/container-smoke.py
